name: node-ci

on:
  pull_request:
    paths:
      - "node/**"
      - ".github/workflows/node-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check registry credentials
        env:
          REGISTRY_API_TOKEN: ${{ secrets.REGISTRY_API_TOKEN }}
        run: |
          if [ -z "${REGISTRY_API_TOKEN}" ]; then
            echo "::notice::REGISTRY_API_TOKEN is not set; unit tests use stubbed registry clients"
          fi

      - name: Run unit tests
        run: npm test
