name: node-ci

on:
  pull_request:
    paths:
      - "node/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        env:
          REVIEW_API_TOKEN: ${REVIEW_API_TOKEN}
