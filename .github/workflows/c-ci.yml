name: c-ci

on:
  pull_request:
    paths:
      - "c/**"
      - ".github/workflows/c-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev
      - name: Build
        run: make -C c all
      - name: Unit tests
        env:
          METER_API_TOKEN: ${{ secrets.METER_API_TOKEN }}
        run: make -C c test
