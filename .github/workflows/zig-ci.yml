name: zig-ci

on:
  pull_request:
    paths:
      - "zig/**"
      - ".github/workflows/zig-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Unit tests
        working-directory: zig
        run: zig build test
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
