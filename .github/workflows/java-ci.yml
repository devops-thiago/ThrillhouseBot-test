name: java-ci

on:
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        env:
          SCHEDULER_API_TOKEN: "${{secrets.SCHEDULER_API_TOKEN}}"
        run: mvn -B test
