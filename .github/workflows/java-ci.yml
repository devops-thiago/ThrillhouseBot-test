name: java-ci

on:
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INSURER_API_TOKEN: ${{ secrets.INSURER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        working-directory: java
        run: mvn -B test
