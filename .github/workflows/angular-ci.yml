name: angular-ci

on:
  pull_request:
    paths:
      - 'angular/**'
      - '.github/workflows/angular-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        env:
          TRACKING_API_TOKEN: ${{ secrets.TRACKING_API_TOKEN }}
