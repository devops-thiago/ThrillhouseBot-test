name: kotlin-ci

on:
  pull_request:
    paths:
      - 'kotlin/**'
      - '.github/workflows/kotlin-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: kotlin/pom.xml
      - name: Run unit tests
        run: mvn -B test
