name: kotlin-ci

on:
  pull_request:
    paths:
      - "kotlin/**"
      - ".github/workflows/kotlin-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        env:
          BOOKING_API_TOKEN: ${{ secrets.BOOKING_API_TOKEN }}
        run: mvn -B test
