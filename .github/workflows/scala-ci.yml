name: scala-ci

on:
  pull_request:
    paths:
      - "scala/**"
      - ".github/workflows/scala-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: scala/pom.xml
      - name: Run unit tests
        run: mvn -B test
        env:
          CUSTOMS_API_TOKEN: ${{ secrets.CUSTOMS_API_TOKEN }}
