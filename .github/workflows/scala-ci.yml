name: scala-ci

on:
  pull_request:
    paths:
      - "scala/**"
      - ".github/workflows/scala-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Run unit tests
        run: sbt test
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
