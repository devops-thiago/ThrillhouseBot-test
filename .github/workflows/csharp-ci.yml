name: csharp-ci

on:
  pull_request:
    paths:
      - "csharp/**"
      - ".github/workflows/csharp-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PARTNER_API_TOKEN: ${{ secrets.PARTNER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore csharp/MuseumTickets.Tests/MuseumTickets.Tests.csproj
      - name: Test
        run: dotnet test csharp/MuseumTickets.Tests/MuseumTickets.Tests.csproj --no-restore -e PARTNER_API_TOKEN=${PARTNER_API_TOKEN}
