[package]
name = "erasure-processor"
version = "0.1.0"
edition = "2021"
description = "Submits deletions for data-erasure requests that are past their regulatory fulfillment deadline."

[[bin]]
name = "erasure-processor"
path = "src/main.rs"

[lib]
name = "erasure_processor"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
